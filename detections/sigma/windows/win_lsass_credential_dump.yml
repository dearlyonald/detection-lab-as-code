title: LSASS Memory Access With Credential Dumping Rights
id: 9e2d7f14-3b86-4c50-a719-4f8c1e6b03da
status: test
description: >
  Detects a process opening a handle to lsass.exe with the access mask required
  to read its memory. LSASS holds plaintext-adjacent credential material for
  every logged-on session, so reading it is the single highest-value action an
  attacker can take on a Windows host. The rule keys on the granted access mask
  rather than on tool names, so it survives renamed binaries, custom loaders and
  tools that have never been seen before - the memory rights are dictated by the
  Windows API, not by the attacker.
author: Wael Qumayi
date: 2026/08/14
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://learn.microsoft.com/en-us/sysinternals/downloads/sysmon
  - https://www.matteomalvica.com/blog/2019/12/02/win-defender-atp-cred-bypass/
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  product: windows
  category: process_access
detection:
  selection:
    TargetImage|endswith: '\lsass.exe'
    # 0x1010 = PROCESS_VM_READ | PROCESS_QUERY_LIMITED_INFORMATION  (minidump)
    # 0x1410 = adds PROCESS_QUERY_INFORMATION                       (procdump)
    # 0x143a = the classic Mimikatz sekurlsa::logonpasswords mask
    # 0x1438 / 0x1f0fff / 0x1fffff = full or near-full access
    GrantedAccess:
      - '0x1010'
      - '0x1410'
      - '0x1418'
      - '0x1438'
      - '0x143a'
      - '0x1f0fff'
      - '0x1fffff'

  # --- Legitimate LSASS readers -------------------------------------------
  # Security products and the OS itself open LSASS constantly. These are
  # filtered on full path, not on filename, so a malicious wmiprvse.exe dropped
  # into %TEMP% is still caught.
  filter_defender:
    SourceImage|startswith:
      - 'C:\Program Files\Windows Defender\'
      - 'C:\ProgramData\Microsoft\Windows Defender\Platform\'

  filter_system_processes:
    SourceImage:
      - 'C:\Windows\System32\wbem\WmiPrvSE.exe'
      - 'C:\Windows\System32\svchost.exe'
      - 'C:\Windows\System32\csrss.exe'
      - 'C:\Windows\System32\wininit.exe'
      - 'C:\Windows\System32\services.exe'
      - 'C:\Windows\System32\lsass.exe'
      - 'C:\Windows\System32\taskmgr.exe'
      - 'C:\Windows\System32\MRT.exe'

  condition: selection and not 1 of filter_*

fields:
  - SourceImage
  - SourceProcessId
  - GrantedAccess
  - CallTrace
  - User

falsepositives:
  - Endpoint detection agents, DLP products and vulnerability scanners that
    inspect process memory. Identify them once, then allow-list the full
    installation path. Do not allow-list by process name alone.
  - Crash-dump and performance tooling such as Windows Error Reporting,
    procdump used by an administrator, or a debugger attached during an incident.
    Correlate with the user context, since SYSTEM at 3am is a very different
    story from a named engineer during a support call.
  - Some backup agents read LSASS to enumerate active sessions.

level: critical
