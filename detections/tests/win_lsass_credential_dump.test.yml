# Behaviour tests for win_lsass_credential_dump.yml
# Sysmon Event ID 10 (ProcessAccess), scoped to lsass.exe by the config in
# provision/windows/sysmon-fallback.xml.

rule: win_lsass_credential_dump.yml

true_positives:

  - name: Mimikatz sekurlsa module reading LSASS
    event:
      EventID: 10
      Channel: Microsoft-Windows-Sysmon/Operational
      Computer: ws01.nexus.lab
      SourceImage: C:\Users\s.alqahtani\AppData\Local\Temp\mk.exe
      SourceProcessId: '5312'
      TargetImage: C:\Windows\system32\lsass.exe
      TargetProcessId: '712'
      GrantedAccess: '0x143a'
      CallTrace: C:\Windows\SYSTEM32\ntdll.dll+9d234|C:\Windows\System32\KERNELBASE.dll+38a3e|UNKNOWN(00007FF8C1A20000)
      User: NEXUS\s.alqahtani

  - name: Renamed procdump creating a minidump of LSASS
    # The binary is renamed and living in a user-writable path, but the access
    # mask is unchanged - which is exactly why this rule keys on the mask.
    event:
      EventID: 10
      Channel: Microsoft-Windows-Sysmon/Operational
      Computer: ws01.nexus.lab
      SourceImage: C:\Users\Public\Documents\svchost.exe
      SourceProcessId: '6104'
      TargetImage: C:\Windows\system32\lsass.exe
      GrantedAccess: '0x1410'
      User: NEXUS\adm.helpdesk

  - name: Comsvcs.dll MiniDump via rundll32
    event:
      EventID: 10
      Channel: Microsoft-Windows-Sysmon/Operational
      Computer: ws01.nexus.lab
      SourceImage: C:\Windows\System32\rundll32.exe
      SourceProcessId: '4488'
      TargetImage: C:\Windows\system32\lsass.exe
      GrantedAccess: '0x1fffff'
      User: NT AUTHORITY\SYSTEM

false_positives:

  - name: Windows Defender scanning process memory
    event:
      EventID: 10
      Channel: Microsoft-Windows-Sysmon/Operational
      Computer: ws01.nexus.lab
      SourceImage: C:\ProgramData\Microsoft\Windows Defender\Platform\4.18.24090.11-0\MsMpEng.exe
      TargetImage: C:\Windows\system32\lsass.exe
      GrantedAccess: '0x1fffff'
      User: NT AUTHORITY\SYSTEM

  - name: WmiPrvSE querying process information
    event:
      EventID: 10
      Channel: Microsoft-Windows-Sysmon/Operational
      Computer: ws01.nexus.lab
      SourceImage: C:\Windows\System32\wbem\WmiPrvSE.exe
      TargetImage: C:\Windows\system32\lsass.exe
      GrantedAccess: '0x1410'
      User: NT AUTHORITY\NETWORK SERVICE

  - name: Low-privilege handle that cannot read memory
    # 0x1000 = PROCESS_QUERY_LIMITED_INFORMATION only. Cannot dump credentials.
    event:
      EventID: 10
      Channel: Microsoft-Windows-Sysmon/Operational
      Computer: ws01.nexus.lab
      SourceImage: C:\Windows\System32\taskhostw.exe
      TargetImage: C:\Windows\system32\lsass.exe
      GrantedAccess: '0x1000'
      User: NEXUS\a.alharbi

  - name: Memory read against a process that is not LSASS
    event:
      EventID: 10
      Channel: Microsoft-Windows-Sysmon/Operational
      Computer: ws01.nexus.lab
      SourceImage: C:\Windows\System32\taskmgr.exe
      TargetImage: C:\Windows\explorer.exe
      GrantedAccess: '0x1fffff'
      User: NEXUS\a.alharbi
